# LuxeMail: LuxeDealers' own email automation (Cloudflare Worker + D1 + Resend).
name = "luxemail-main"
main = "src/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "luxemail-main"
database_id = "eb1197c7-0323-4435-8c95-129d93bb8f80"

[triggers]
# Every 30 minutes: process reminders and drain the outbox. Daily and fortnightly jobs gate themselves on time.
crons = ["*/30 * * * *"]

[vars]
SHOP_DOMAIN = "ya9p17-nn.myshopify.com"
STORE_URL = "https://luxedealers.com"
# Set by deploy.sh to the Worker's address.
PUBLIC_URL = "https://luxemail-main.turbozzgeezzz.workers.dev"
BRAND = "LuxeDealers"
FROM_EMAIL = "LuxeDealers <hello@mail.luxedealers.com>"
REPLY_TO = "support@luxedealers.com"
ADMIN_EMAIL = "support@luxedealers.com"
TIMEZONE_OFFSET_HOURS = "10"
DAILY_SEND_LIMIT = "95"
# Emails per 30-minute run; keeps each run under Cloudflare's free-plan limit of 50 outbound requests.
BATCH_SIZE = "6"
SHOPIFY_API_VERSION = "2025-10"
VIP_SPEND_CENTS = "25000"
LAPSED_DAYS = "60"
# Sending domain in Resend (mail.luxedealers.com). Mail only goes out once Resend shows it as verified.
RESEND_DOMAIN_ID = "4e6f275e-1d9b-4a46-966c-1452d295e315"
# Master switch. "0": sign-ups, browsing and checkouts are recorded and emails are queued, but nothing is sent
# and no discount codes are created. Set to "1" once the luxedealers.com sending domain is verified in Resend.
SENDING_ENABLED = "1"
# Spend-and-save tiers in cents (Shopify automatic discounts). "0" hides them in emails.
TIER1_SPEND_CENTS = "0"
TIER1_PERCENT = "5"
TIER2_SPEND_CENTS = "0"
TIER2_PERCENT = "10"
BEST_COLLECTION = "shop-all"

# Secrets (set with `wrangler secret put NAME`):
# SHOPIFY_CLIENT_ID, SHOPIFY_CLIENT_SECRET, RESEND_API_KEY, UNSUB_SECRET
